---
# Un solo nodo Proxmox (pve1). ans01 hace también de bastion host.
all:
  vars:
    ansible_user: ansible
    ansible_python_interpreter: auto_silent
    ansible_ssh_common_args: '-o StrictHostKeyChecking=yes'
  children:
    firewall:
      hosts:
        fw01: { ansible_host: 10.108.10.1, ansible_connection: local }   # OPNsense: se gestiona por API
    management:
      hosts:
        ans01: { ansible_host: 10.108.10.10, ansible_connection: local }
        mon01: { ansible_host: 10.108.10.20 }
    monitor:
      hosts:
        mon01:
    proxmox:
      hosts:
        pve1: { ansible_host: 10.108.10.5 }
    web:
      hosts:
        proxy01: { ansible_host: 10.108.20.10 }
    app:
      hosts:
        app01: { ansible_host: 10.108.30.10 }     # Nextcloud y PostgreSQL
    db:
      hosts:
        app01:
