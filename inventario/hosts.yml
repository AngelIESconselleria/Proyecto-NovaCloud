---
all:
  vars:
    ansible_user: ansible
    ansible_python_interpreter: auto_silent
    ansible_ssh_common_args: '-o StrictHostKeyChecking=yes'
  children:
    firewall:
      hosts:
        fw01: { ansible_host: 10.108.10.1, ansible_connection: local }   # OPNsense: se gestiona por API
    management:
      hosts:
        bas01: { ansible_host: 10.108.10.10 }
        ans01: { ansible_host: 10.108.10.20, ansible_connection: local }
        mon01: { ansible_host: 10.108.10.30 }
    monitor:
      hosts:
        mon01:
    proxmox:
      hosts:
        pve1: { ansible_host: 10.108.10.11 }
        pve2: { ansible_host: 10.108.10.12 }
    web:
      hosts:
        proxy01: { ansible_host: 10.108.20.10 }
    app:
      hosts:
        ipa01: { ansible_host: 10.108.30.10 }
        erp01: { ansible_host: 10.108.30.20 }
        nc01: { ansible_host: 10.108.30.30 }
    db:
      hosts:
        db01: { ansible_host: 10.108.40.10 }
    backup:
      hosts:
        pbs1: { ansible_host: 10.108.50.10 }
