---
- name: Instalar Nginx
  ansible.builtin.apt:
    name: nginx
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Publicar Nextcloud como proxy inverso
  ansible.builtin.template:
    src: "{{ playbook_dir }}/../plantillas/nginx_proxy.conf.j2"
    dest: /etc/nginx/conf.d/nextcloud.conf
    owner: root
    group: root
    mode: "0644"
  notify: Recargar nginx

- name: Activar Nginx al arrancar
  ansible.builtin.service:
    name: nginx
    enabled: true
    state: started
